name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - uses: gradle/actions/setup-gradle@v3

    - name: Build generic + preview release APKs
      run: |
        chmod +x gradlew
        ./gradlew assembleGenericRelease assembleGithubPreviewRelease

    - name: Sign generic APKs
      uses: ilharp/sign-android-release@nightly
      with:
        releaseDir: app/build/outputs/apk/generic/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Sign preview APKs
      uses: ilharp/sign-android-release@nightly
      with:
        releaseDir: app/build/outputs/apk/githubPreview/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-apks
        path: |
          app/build/outputs/apk/generic/release/*-signed.apk
          app/build/outputs/apk/githubPreview/release/*-signed.apk
        if-no-files-found: error
        retention-days: 20

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(app/build/outputs/apk/generic/release/*-signed.apk app/build/outputs/apk/githubPreview/release/*-signed.apk)
        [ ${#apks[@]} -gt 0 ] || { echo "No signed APKs found"; exit 1; }
        version=$(basename "${apks[0]}" | sed -E 's/^Seal-(.+)-(generic|githubPreview)-.*$/\1/')
        tag="v$version"
        prerelease=""
        [[ "$version" == *-* ]] && prerelease="--prerelease"
        gh release create "$tag" "${apks[@]}" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$tag" \
          --generate-notes \
          $prerelease
